<script>
  if ("serviceWorker" in navigator && location.protocol.startsWith("http") && !/localhost|127\.0\.0\.1/.test(location.hostname)) {
    window.addEventListener("load", () => navigator.serviceWorker.register("./sw.js").then((reg) => {
      const announce = () => {
        if (document.getElementById("update-banner")) return;
        const b = document.createElement("button");
        b.id = "update-banner";
        b.textContent = "A new version of Hexfront is ready. Tap to reload.";
        b.style.cssText = "position:fixed;left:12px;right:12px;bottom:calc(16px + env(safe-area-inset-bottom));z-index:99;padding:14px;border-radius:14px;border:1px solid #3FC1C9;background:#171D26;color:#E8ECF1;font:600 15px system-ui,sans-serif;text-align:center;box-shadow:0 8px 24px rgba(0,0,0,.5)";
        b.onclick = () => location.reload();
        document.body.appendChild(b);
      };
      if (reg.waiting && navigator.serviceWorker.controller) announce();
      reg.addEventListener("updatefound", () => { const w = reg.installing; if (!w) return; w.addEventListener("statechange", () => { if (w.state === "installed" && navigator.serviceWorker.controller) announce(); }); });
      setInterval(() => reg.update().catch(() => {}), 10 * 60 * 1000);
    }).catch(() => {}));
  }
