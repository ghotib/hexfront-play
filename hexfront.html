ge over several turns and fire at the start of the resolve."),t("Base defenses","Gun turret (one hex, 35), Missile battery (two hexes, 50, needs Rocket artillery) and Tesla coil (one hex, 70, needs Fusion and power) each fire once a turn, at the first enemy to come in range or at whoever is still camped there when the movement ends. Walls raise the garrison's defense."),t("Surrender","A rival down to one base and no army will offer to surrender; accepting hands you their bases at once. You can demand it from Intel when you have them beaten."),t("Building","Each base runs two lines at once: one structure and one unit. Rush pays 100 ore per remaining turn beyond the first to finish an item at the next resolve."),t("Economy","Harvesters parked on ore bring in 30 a turn. Every structure draws power; go over capacity and builds slow to half speed. Refineries unlock more harvesters."),t("Combat","Equal strength does about 30 damage. Forest and hills give +25% defense, fortified units +25%, a base +50% and a wall another +50%. Artillery fires from two hexes away and takes no return fire."),t("Winning","Take every rival base, or finish the Orbital launch doctrine. Lose all of your bases and the campaign is over.")),{title:"How to play",body:e,icon:O("intel",20)}}function Uw(i){const e={...i.settings},t=d("div.col",{style:{gap:"14px"}}),n=d("input",{type:"text",value:e.houseCode,placeholder:"house code, 4 to 32 characters",autocapitalize:"off",autocomplete:"off",spellcheck:!1,maxLength:32,"aria-label":"House code",style:Cd}),r=d("input",{type:"text",value:e.commander,placeholder:"your name",autocomplete:"off",maxLength:20,"aria-label":"Commander name",style:Cd}),s=d("div.muted",{style:{fontSize:"12px"}},i.cloudStatus()||(Lt.test(e.houseCode)?"Saving to the server after every turn.":"Progress stays on this device until you set a house code."));if(t.append(d("div",{style:{fontSize:"13px",color:"var(--soft)"}},"Everyone in the house types the same code once, in any of the games <script>
  if ("serviceWorker" in navigator && location.protocol.startsWith("http") && !/localhost|127\.0\.0\.1/.test(location.hostname)) {
    window.addEventListener("load", () => navigator.serviceWorker.register("./sw.js").then((reg) => {
      const announce = () => {
        if (document.getElementById("update-banner")) return;
        const b = document.createElement("button");
        b.id = "update-banner";
        b.textContent = "A new version of Hexfront is ready. Tap to reload.";
        b.style.cssText = "position:fixed;left:12px;right:12px;bottom:calc(16px + env(safe-area-inset-bottom));z-index:99;padding:14px;border-radius:14px;border:1px solid #3FC1C9;background:#171D26;color:#E8ECF1;font:600 15px system-ui,sans-serif;text-align:center;box-shadow:0 8px 24px rgba(0,0,0,.5)";
        b.onclick = () => location.reload();
        document.body.appendChild(b);
      };
      if (reg.waiting && navigator.serviceWorker.controller) announce();
      reg.addEventListener("updatefound", () => { const w = reg.installing; if (!w) return; w.addEventListener("statechange", () => { if (w.state === "installed" && navigator.serviceWorker.controller) announce(); }); });
      setInterval(() => reg.update().catch(() => {}), 10 * 60 * 1000);
    }).catch(() => {}));
  }
</script>
