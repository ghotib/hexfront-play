mando: one per commander, unseen unless an enemy is adjacent, ignores base defenses, and sabotages a base (queue wiped, power halved two turns). Engineer, Concord only: walks into an enemy base below 50 strength with no garrison and takes it, or repairs your own base 40 a turn. Spy, Solaris only: unseen, parks next to an enemy base and reads it in Intel. Skimmer hovers over water. Juggernaut is Vanguard's heavy tank and the Lance gun is Solaris's three-hex gun."),t("Late game","A Service depot repairs units in its territory 25 a turn. Upgrades on the base sheet fit every unit at once. A Tesla coil zaps the first enemy to come within a hex of the base each turn. With Fusion you can build one Superweapon: Vanguard fires a Nuclear strike two rings wide that scorches the ground, Solaris calls a Tesla storm that chains across five units, Concord makes a Chrono shift that teleports a unit and everyone next to it. They charge over several turns and fire at the start of the resolve."),t("Base defenses","Gun turret (one hex, 35), Missile battery (two hexes, 50, needs Rocket artillery) and Tesla coil (one hex, 70, needs Fusion and power) each fire once a turn, at the first enemy to come in range or at whoever is still camped there when the movement ends. Walls raise the garrison's defense."),t("Surrender","A rival down to one base and no army will offer to surrender; accepting hands you their bases at once. You can demand it from Intel when you have them beaten."),t("Building","Each base runs two lines at once: one structure and one unit. Rush pays 100 ore per remaining turn beyond the first to finish an item at the next resolve."),t("Economy","Harvesters parked on ore bring in 30 a turn. Every structure draws power; go over capacity and builds slow to half speed. Refineries unlock more harvesters."),t("Combat","Equal strength does about 30 damage. Forest and hills give +25% defense, fortified units +25%, a base +50% and a wall another +50%. Artillery fires from two hexes awa       };
      if (reg.waiting && navigator.serviceWorker.controller) announce();
      reg.addEventListener("updatefound", () => { const w = reg.installing; if (!w) return; w.addEventListener("statechange", () => { if (w.state === "installed" && navigator.serviceWorker.controller) announce(); }); });
      setInterval(() => reg.update().catch(() => {}), 10 * 60 * 1000);
    }).catch(() => {}));
  }
</script>
